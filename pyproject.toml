[project]
name = "python-starter"
version = "0.1.0"
description = "Python Playground Kit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.1.1",
]

[dependency-groups]
dev = [
    "justsdk>=2.2.0",
    "pre-commit>=4.2.0",
    "pyright>=1.1.407",
    "pytest>=8.4.1",
    "ruff>=0.12.3",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--verbose",
    "--no-header",
    "-s"
]
